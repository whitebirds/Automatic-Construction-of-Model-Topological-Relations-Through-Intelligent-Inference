[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-inference-code"
version = "0.1.0"
description = "Equipment model topology inference: numerical methods and synthetic execution example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.3.5,<3"]

[project.scripts]
topology-inference = "topology_inference.pipeline:main"

[tool.setuptools.packages.find]
include = ["topology_inference*"]
